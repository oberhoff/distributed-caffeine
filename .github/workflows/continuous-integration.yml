name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '**'

# read only: the jobs check out and report through the job's own tokens (annotations, summary, artifacts); actions to
# look up the passed markers, the markers themselves live in the Actions cache
permissions:
  contents: read
  actions: read

# a newer push to a pull request or another branch cancels the run it outdates, so that bursts (Dependabot opens
# several pull requests at once) do not queue outdated groups for the 20 runners; on main and develop every commit
# keeps its run and its result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  # a cache entry per tree that passed every group (passed below) marks it as tested: a run on the same content skips
  # the groups, such as the push to develop after a pull request whose merge result it equals, a reopened or retargeted
  # pull request, or a commit that only changes its message. The tree, not the commit, as merging and rebasing create
  # new commits of the same content. Found through the API, as a run reads only the caches of its own branch and the
  # default branch, and a pull request saves in its own scope. Only markers saved from this repository's branches and
  # pull requests count: a pull request from a fork runs its own copy of this file and could save any marker
  changes:
    name: Check for a tested tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.marker.outputs.tree }}
      tested: ${{ steps.marker.outputs.tested }}
    steps:
      - name: Look up the marker
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${SHA}" --jq .tree.sha)
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"
          refs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=ci-passed-${tree}" \
            --jq ".actions_caches[] | select(.key == \"ci-passed-${tree}\") | .ref")
          tested=false
          for ref in $refs; do
            case "$ref" in
              refs/heads/*)
                tested=true ;;
              refs/pull/*/merge)
                number=${ref#refs/pull/}
                head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number%/merge}" --jq .head.repo.full_name)
                if [ "$head" = "$GITHUB_REPOSITORY" ]; then tested=true; fi ;;
            esac
          done
          echo "tested=${tested}" >> "$GITHUB_OUTPUT"
          if [ "$tested" = true ]; then
            echo "::notice::Tree ${tree} already passed: skipping the groups"
          fi

  continuous-integration:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    # a group takes about 5-7 min: a hanging test ends here, not after GitHub's six hours
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # one runner per group, as in the nightly full matrix (nightly-full-matrix-tests.yml), so the store suites
          # neither wait for nor disturb each other, and groups of about 5-7 min each, as a run takes as long as its
          # longest group. Only the first group runs the whole build (Error Prone and NullAway, javadoc, packaging);
          # the others compile without Error Prone and stop after the tests. Together the groups cover every test of a
          # single run, the integration tests on the latest image of each store (-DrunsOnGitHub)
          # the in-memory tests in two groups: A with the whole build, B with the two longest classes (about 3 and
          # 2.5 min on GitHub's runners)
          - name: Test in-memory A
            goal: clean verify
            tests: "!%regex[.*(IntegrationTest|jmh_generated|InternalPathParityTest|InternalPropertyTest).*]"
          - name: Test in-memory B
            goal: -DskipErrorProne test
            tests: "InternalPathParityTest,InternalPropertyTest"
          - name: Test MongoDB
            goal: -DskipErrorProne test
            tests: "MongoIntegrationTest$*"
          - name: Test PostgreSQL
            goal: -DskipErrorProne test
            tests: "PostgresIntegrationTest$*"
          - name: Test Redis
            goal: -DskipErrorProne test
            tests: "RedisIntegrationTest$Redis_*"
          - name: Test Valkey
            goal: -DskipErrorProne test
            tests: "RedisIntegrationTest$Valkey_*"
          - name: Test Dragonfly
            goal: -DskipErrorProne test
            tests: "RedisIntegrationTest$Dragonfly_*"
          - name: Test Kvrocks
            goal: -DskipErrorProne test
            tests: "RedisIntegrationTest$Kvrocks_*"
          - name: Test MariaDB
            goal: -DskipErrorProne test
            tests: "JdbcIntegrationTest$MariaDB_*"
          - name: Test MySQL
            goal: -DskipErrorProne test
            tests: "JdbcIntegrationTest$MySQL_*"
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # JDK 25, not the baseline 17: Error Prone and NullAway, which the build runs, need JDK 21 or newer. The
      # compiler's release 17 (pom.xml) still rejects any API newer than Java 17; the tests run on Java 17 in the
      # nightly full matrix (nightly-full-matrix-tests.yml), and the release is built with JDK 17
      # (continuous-delivery.yml)
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify with Maven
        # no failIfNoSpecifiedTests=false: a group whose pattern matches no test fails instead of passing with
        # nothing tested. Single quotes: in double quotes bash expands the nested class names ($Redis_*) as variables
        # and every group runs the whole test class
        run: mvn -B ${{ matrix.goal }} -DrunsOnGitHub '-Dtest=${{ matrix.tests }}'
      - name: Report failed tests
        if: failure()
        uses: ./.github/workflows/common/report-failed-tests
        with:
          artifact-name: failed-tests-${{ strategy.job-index }}

  passed:
    name: Mark the tree as passed
    needs: [ changes, continuous-integration ]
    if: needs.continuous-integration.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the marker
        run: echo "${{ needs.changes.outputs.tree }}" > ci-passed
      - name: Save the marker
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-passed
          key: ci-passed-${{ needs.changes.outputs.tree }}

  # one check under the name the single job had, which branch protection can require however the groups change;
  # always(), as a job skipped after a failed group would count as passed. Skipped groups pass only for a tested tree
  # (changes above), which also keeps the release's check of this workflow (continuous-delivery.yml) meaningful
  result:
    name: Continuous Integration (CI)
    needs: [ changes, continuous-integration ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every group to pass
        env:
          GROUPS_RESULT: ${{ needs.continuous-integration.result }}
          TESTED: ${{ needs.changes.outputs.tested }}
        run: test "$GROUPS_RESULT" = success || { test "$GROUPS_RESULT" = skipped && test "$TESTED" = true; }
