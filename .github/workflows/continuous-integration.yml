name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '**'

jobs:
  continuous-integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # one runner per group, as in the nightly full matrix (nightly-full-matrix-tests.yml), so the store suites
          # neither wait for nor disturb each other. Only the first group runs the whole build (Error Prone and
          # NullAway, javadoc, packaging); the store groups compile without Error Prone and stop after the tests.
          # Together the groups cover every test of a single run, the integration tests on the latest image of each
          # store (-DrunsOnGitHub)
          - name: Test in-memory
            goal: clean verify
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
          - name: Test MongoDB, PostgreSQL
            goal: -DskipErrorProne test
            tests: "MongoIntegrationTest$*,PostgresIntegrationTest$*"
          - name: Test Redis, Valkey
            goal: -DskipErrorProne test
            tests: "RedisIntegrationTest$Redis_*,RedisIntegrationTest$Valkey_*"
          - name: Test Dragonfly, Kvrocks
            goal: -DskipErrorProne test
            tests: "RedisIntegrationTest$Dragonfly_*,RedisIntegrationTest$Kvrocks_*"
          - name: Test MariaDB, MySQL
            goal: -DskipErrorProne test
            tests: "JdbcIntegrationTest$*"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      # JDK 25, not the baseline 17: Error Prone and NullAway, which the build runs, need JDK 21 or newer. The
      # compiler's release 17 (pom.xml) still rejects any API newer than Java 17; the tests run on Java 17 in the
      # nightly full matrix (nightly-full-matrix-tests.yml), and the release is built with JDK 17
      # (continuous-delivery.yml)
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify with Maven
        # no failIfNoSpecifiedTests=false: a group whose pattern matches no test fails instead of passing with
        # nothing tested. Single quotes: in double quotes bash expands the nested class names ($Redis_*) as variables
        # and every group runs the whole test class
        run: mvn -B ${{ matrix.goal }} -DrunsOnGitHub '-Dtest=${{ matrix.tests }}'
      # the failures each test JVM recorded (testing.FailureLog), as Surefire's reports keep only the last topology
      # of a class: an annotation each, readable through the API (a job's check run), the whole list in the job
      # summary (GitHub shows at most 10 error annotations per step), and the files as an artifact
      - name: Report failed tests
        if: failure()
        run: |
          shopt -s nullglob
          files=(target/test-failures/*.txt)
          [ ${#files[@]} -gt 0 ] || exit 0
          {
            echo "### Failed tests"
            echo
            sort -u "${files[@]}" | while IFS=$'\t' read -r test message; do echo "- **${test}**: ${message}"; done
          } >> "$GITHUB_STEP_SUMMARY"
          sort -u "${files[@]}" | while IFS=$'\t' read -r test message; do
            title=${test//%/%25}; title=${title//,/%2C}; title=${title//:/%3A}
            echo "::error title=${title}::${message//%/%25}"
          done
      - name: Keep the failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-${{ strategy.job-index }}
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 14

  # one check under the name the single job had, which branch protection can require however the groups change;
  # always(), as a job skipped after a failed group would count as passed
  result:
    name: Continuous Integration (CI)
    needs: continuous-integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every group to pass
        run: test "${{ needs.continuous-integration.result }}" = success
