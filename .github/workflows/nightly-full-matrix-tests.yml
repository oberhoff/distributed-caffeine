name: Nightly Full Matrix Tests

# every image and topology of every store, one runner per group, so the groups neither wait for nor disturb each
# other, on JDK 17: the oldest supported, which the release is built for (continuous-delivery.yml). The per-push
# workflow (continuous-integration.yml) covers JDK 25 with Error Prone and NullAway, on the latest image of each store
# (-DrunsOnGitHub)
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  changes:
    name: Check for changes since the last nightly
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      changed: ${{ github.event_name != 'schedule' || steps.marker.outputs.cache-hit != 'true' }}
    steps:
      - name: Resolve develop
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api repos/${{ github.repository }}/commits/develop --jq .sha)" >> "$GITHUB_OUTPUT"
      # a cache entry per tested commit marks it as done: a nightly without new commits on develop finds the marker
      # and skips every group; marked when the run starts, so a failed commit is not retested each night either.
      # Each nightly lookup keeps the entry from expiring (7 days unused)
      - name: Look up the marker
        id: marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: nightly-marker
          key: nightly-tested-${{ steps.head.outputs.sha }}
          lookup-only: true
      - name: Create the marker
        if: github.event_name == 'schedule' && steps.marker.outputs.cache-hit != 'true'
        run: echo "${{ steps.head.outputs.sha }}" > nightly-marker
      - name: Save the marker
        if: github.event_name == 'schedule' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: nightly-marker
          key: nightly-tested-${{ steps.head.outputs.sha }}

  group:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # a job per store major, so a failed job names the major and "Re-run failed jobs" repeats only that one; the
          # setup and compiling cost about 30 s per job. Longest first, as at most 20 jobs run at once (account-wide)
          # and the rest wait: the bound is the interleavings job (50-70 min on GitHub's runners), while the whole
          # matrix is about 800 runner-minutes, so the queued jobs still finish before it. Then the store majors
          # (MongoDB, Redis and Valkey about 20-30 min each, MySQL about 18, PostgreSQL about 12), the in-memory suites
          # on each store profile (the default is jdbc), and MariaDB, the shortest, last. The experiments
          # (-Dexperiments) and the managed Redis services (-Dredis.external) stay manual. Model checking in jobs of
          # its own, apart from the in-memory suites: it takes about 50-70 min for the interleavings and 35-45 min for
          # each of the three linearizability classes (measured 2026-11-12, when one job with the in-memory suites ran
          # into the timeout, and 2026-11-16). The linearizability classes run in three JVMs at once (a JVM per class,
          # reuseForks=false), as model checking keeps about one of the runner's four CPUs busy: one after another they
          # took 119 of the 120 min
          - name: Test model checking, interleavings
            tests: "InternalInterleavingTest"
            flags: -Dmodelchecking=true
          - name: Test model checking, linearizability
            tests: "InternalLinearizability*Test"
            flags: -Dmodelchecking=true -DforkCount=3
          - name: Test MongoDB 9
            tests: "MongoIntegrationTest$Mongo_9_*"
          - name: Test MongoDB 4
            tests: "MongoIntegrationTest$Mongo_4_*"
          - name: Test Redis 6
            tests: "RedisIntegrationTest$Redis_6_*"
          - name: Test MongoDB 8
            tests: "MongoIntegrationTest$Mongo_8_*"
          - name: Test MongoDB 7
            tests: "MongoIntegrationTest$Mongo_7_*"
          - name: Test MongoDB 6
            tests: "MongoIntegrationTest$Mongo_6_*"
          - name: Test Redis 7
            tests: "RedisIntegrationTest$Redis_7_*"
          - name: Test Redis 8
            tests: "RedisIntegrationTest$Redis_8_*"
          - name: Test Valkey 7
            tests: "RedisIntegrationTest$Valkey_7_*"
          - name: Test Valkey 8
            tests: "RedisIntegrationTest$Valkey_8_*"
          - name: Test Valkey 9
            tests: "RedisIntegrationTest$Valkey_9_*"
          - name: Test Dragonfly 1
            tests: "RedisIntegrationTest$Dragonfly_1_*"
          - name: Test Dragonfly 2
            tests: "RedisIntegrationTest$Dragonfly_2_*"
          - name: Test Kvrocks 2
            tests: "RedisIntegrationTest$Kvrocks_2_*"
          - name: Test MongoDB 5
            tests: "MongoIntegrationTest$Mongo_5_*"
          - name: Test MySQL 5
            tests: "JdbcIntegrationTest$MySQL_5_*"
          - name: Test MySQL 26
            tests: "JdbcIntegrationTest$MySQL_26_*"
          - name: Test MySQL 8
            tests: "JdbcIntegrationTest$MySQL_8_*"
          - name: Test MySQL 9
            tests: "JdbcIntegrationTest$MySQL_9_*"
          - name: Test PostgreSQL 18
            tests: "PostgresIntegrationTest$Postgres_18_*"
          - name: Test PostgreSQL 9
            tests: "PostgresIntegrationTest$Postgres_9_*"
          - name: Test PostgreSQL 17
            tests: "PostgresIntegrationTest$Postgres_17_*"
          - name: Test PostgreSQL 16
            tests: "PostgresIntegrationTest$Postgres_16_*"
          - name: Test PostgreSQL 15
            tests: "PostgresIntegrationTest$Postgres_15_*"
          - name: Test PostgreSQL 14
            tests: "PostgresIntegrationTest$Postgres_14_*"
          - name: Test PostgreSQL 13
            tests: "PostgresIntegrationTest$Postgres_13_*"
          - name: Test PostgreSQL 12
            tests: "PostgresIntegrationTest$Postgres_12_*"
          - name: Test PostgreSQL 11
            tests: "PostgresIntegrationTest$Postgres_11_*"
          - name: Test PostgreSQL 10
            tests: "PostgresIntegrationTest$Postgres_10_*"
          - name: Test in-memory
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
          - name: Test in-memory, postgresql
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=postgresql
          - name: Test in-memory, mongodb
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=mongodb
          - name: Test in-memory, redis
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=redis
          - name: Test in-memory, redis-hostile
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=redis-hostile
          - name: Test in-memory, postgresql-stepping
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=postgresql-stepping
          - name: Test MariaDB 10
            tests: "JdbcIntegrationTest$MariaDB_10_*"
          - name: Test MariaDB 13
            tests: "JdbcIntegrationTest$MariaDB_13_*"
          - name: Test MariaDB 11
            tests: "JdbcIntegrationTest$MariaDB_11_*"
          - name: Test MariaDB 12
            tests: "JdbcIntegrationTest$MariaDB_12_*"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          # nightly: the develop commit resolved above, as scheduled runs start from the default branch, so every
          # group tests the marked commit even if develop moves meanwhile; by hand: the branch chosen
          ref: ${{ github.event_name == 'schedule' && needs.changes.outputs.sha || github.ref }}
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run the group
        # no failIfNoSpecifiedTests=false: a group whose pattern matches no test (a typo, or a branch without these
        # tests) fails instead of passing with nothing tested. Single quotes: in double quotes bash expands the nested
        # class names ($Mongo_4_*) as variables and every group runs the whole test class
        run: mvn -B -DskipErrorProne test '-Dtest=${{ matrix.tests }}' ${{ matrix.flags }}
      # the failures each test JVM recorded (testing.FailureLog), as Surefire's reports keep only the last topology
      # of a class: an annotation each, readable through the API (a job's check run), the whole list in the job
      # summary (GitHub shows at most 10 error annotations per step), and the files as an artifact
      - name: Report failed tests
        if: failure()
        run: |
          shopt -s nullglob
          files=(target/test-failures/*.txt)
          [ ${#files[@]} -gt 0 ] || exit 0
          {
            echo "### Failed tests"
            echo
            sort -u "${files[@]}" | while IFS=$'\t' read -r test message; do echo "- **${test}**: ${message}"; done
          } >> "$GITHUB_STEP_SUMMARY"
          sort -u "${files[@]}" | while IFS=$'\t' read -r test message; do
            title=${test//%/%25}; title=${title//,/%2C}; title=${title//:/%3A}
            echo "::error title=${title}::${message//%/%25}"
          done
      - name: Keep the failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-${{ strategy.job-index }}
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 14
