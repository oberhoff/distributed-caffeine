name: Nightly Full Matrix Tests

# every image and topology of every store, one runner per group, so the groups neither wait for nor disturb each
# other, on JDK 17: the oldest supported, which the release is built for (continuous-delivery.yml). The per-push
# workflow (continuous-integration.yml) covers JDK 25 with Error Prone and NullAway, on the latest image of each store
# (-DrunsOnGitHub)
on:
  schedule:
    # GitHub reads cron in UTC
    - cron: "42 0 * * *"
  # by hand: develop unless another branch, tag or commit is given, whichever branch the dialog's "Use workflow from"
  # shows (it preselects main, the last release, and only picks the copy of this file that runs)
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to test
        default: develop

# read only: the marker lives in the Actions cache, and the jobs report through their own tokens
permissions:
  contents: read

jobs:
  changes:
    name: Check for changes since the last nightly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      changed: ${{ github.event_name != 'schedule' || steps.marker.outputs.cache-hit != 'true' }}
    steps:
      # one commit for the whole run: every group checks it out, so a push meanwhile changes nothing, and the passed
      # marker below names what every group tested; scheduled runs have no inputs, so they test develop
      - name: Resolve the commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'develop' }}
        run: echo "sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)" >> "$GITHUB_OUTPUT"
      # a cache entry per tested commit marks it as done: a nightly without new commits on develop finds the marker
      # and skips every group; marked when the run starts, so a failed commit is not retested each night either.
      # Each nightly lookup keeps the entry from expiring (7 days unused)
      - name: Look up the marker
        id: marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nightly-marker
          key: nightly-tested-${{ steps.head.outputs.sha }}
          lookup-only: true
      - name: Create the marker
        if: github.event_name == 'schedule' && steps.marker.outputs.cache-hit != 'true'
        run: echo "${{ steps.head.outputs.sha }}" > nightly-marker
      - name: Save the marker
        if: github.event_name == 'schedule' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nightly-marker
          key: nightly-tested-${{ steps.head.outputs.sha }}

  group:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # most jobs take up to about 25 min on a slow day, a hanging test ending here; a job naming a timeout of its own
    # (interleavings A) gets that
    timeout-minutes: ${{ matrix.timeout || 45 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # small jobs of at most about 15-20 min, as GitHub starts matrix jobs in no particular order and at most 20
          # run at once (account-wide), the rest waiting: a run then takes about its runner-minutes / 20 plus its
          # longest job, whichever jobs start first (seen 2026-11-16, when store majors took the slots while the
          # 50-70 min model checking jobs waited). A failed job names its part, and "Re-run failed jobs" repeats only
          # that one; the setup and compiling cost about 30 s per job. The experiments (-Dexperiments) and the managed
          # Redis services (-Dredis.external) stay manual
          # model checking: the interleavings by method, E every method that A to D leave, so that a new one runs
          # without a change here. A method takes about 3-7 min on GitHub's runners (500 invocations; their speed
          # varies by a factor of two), a_load_finding_* six times that (3,000), so its job alone has a longer bound.
          # The linearizability classes in three shards each, a third of their Lincheck scenarios per job
          # (ShardedScenarios), their stress tests running in the in-memory suites
          - name: Test model checking, interleavings A
            tests: "InternalInterleavingTest#a_load_finding_*"
            flags: -Dmodelchecking=true
            timeout: 75
          - name: Test model checking, interleavings B
            tests: "InternalInterleavingTest#a_load_racing_a_*"
            flags: -Dmodelchecking=true
          - name: Test model checking, interleavings C
            tests: "InternalInterleavingTest#two_*"
            flags: -Dmodelchecking=true
          - name: Test model checking, interleavings D
            tests: "InternalInterleavingTest#a_load_racing_an_*+a_refresh_*"
            flags: -Dmodelchecking=true
          - name: Test model checking, interleavings E
            tests: "InternalInterleavingTest,!InternalInterleavingTest#a_load_finding_*+a_load_racing_a_*+a_load_racing_an_*+a_refresh_*+two_*"
            flags: -Dmodelchecking=true
          - name: Test model checking, linearizability, one instance 1/3
            tests: "InternalLinearizabilityTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=1/3
          - name: Test model checking, linearizability, one instance 2/3
            tests: "InternalLinearizabilityTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=2/3
          - name: Test model checking, linearizability, one instance 3/3
            tests: "InternalLinearizabilityTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=3/3
          - name: Test model checking, linearizability, invalidateAll 1/3
            tests: "InternalLinearizabilityInvalidateAllTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=1/3
          - name: Test model checking, linearizability, invalidateAll 2/3
            tests: "InternalLinearizabilityInvalidateAllTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=2/3
          - name: Test model checking, linearizability, invalidateAll 3/3
            tests: "InternalLinearizabilityInvalidateAllTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=3/3
          - name: Test model checking, linearizability, two instances 1/3
            tests: "InternalLinearizabilityTwoInstancesTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=1/3
          - name: Test model checking, linearizability, two instances 2/3
            tests: "InternalLinearizabilityTwoInstancesTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=2/3
          - name: Test model checking, linearizability, two instances 3/3
            tests: "InternalLinearizabilityTwoInstancesTest#model_checking"
            flags: -Dmodelchecking=true -Dlincheck.shard=3/3
          # the in-memory suites on each store profile (the default is jdbc)
          - name: Test in-memory
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
          - name: Test in-memory, postgresql
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=postgresql
          - name: Test in-memory, mongodb
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=mongodb
          - name: Test in-memory, redis
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=redis
          - name: Test in-memory, redis-hostile
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=redis-hostile
          - name: Test in-memory, postgresql-stepping
            tests: "!%regex[.*(IntegrationTest|jmh_generated).*]"
            flags: -Dinmemory.profile=postgresql-stepping
          # a store major of about 15 min or more in two jobs: its heaviest topologies (MongoDB: the three-node replica
          # sets, the only ones with the failover suite; the others: the latest image, the only one with every suite) and
          # the rest of the major, by exclusion, so a topology added later runs in the rest without a change here
          - name: Test MongoDB 4, three-node replica sets
            tests: "MongoIntegrationTest$Mongo_4_*__Three_Node_Replica_Set"
          - name: Test MongoDB 4, other topologies
            tests: "MongoIntegrationTest$Mongo_4_*,!MongoIntegrationTest$Mongo_4_*__Three_Node_Replica_Set"
          - name: Test MongoDB 5, three-node replica sets
            tests: "MongoIntegrationTest$Mongo_5_*__Three_Node_Replica_Set"
          - name: Test MongoDB 5, other topologies
            tests: "MongoIntegrationTest$Mongo_5_*,!MongoIntegrationTest$Mongo_5_*__Three_Node_Replica_Set"
          - name: Test MongoDB 6, three-node replica sets
            tests: "MongoIntegrationTest$Mongo_6_*__Three_Node_Replica_Set"
          - name: Test MongoDB 6, other topologies
            tests: "MongoIntegrationTest$Mongo_6_*,!MongoIntegrationTest$Mongo_6_*__Three_Node_Replica_Set"
          - name: Test MongoDB 7, three-node replica sets
            tests: "MongoIntegrationTest$Mongo_7_*__Three_Node_Replica_Set"
          - name: Test MongoDB 7, other topologies
            tests: "MongoIntegrationTest$Mongo_7_*,!MongoIntegrationTest$Mongo_7_*__Three_Node_Replica_Set"
          - name: Test MongoDB 8, three-node replica sets
            tests: "MongoIntegrationTest$Mongo_8_*__Three_Node_Replica_Set"
          - name: Test MongoDB 8, other topologies
            tests: "MongoIntegrationTest$Mongo_8_*,!MongoIntegrationTest$Mongo_8_*__Three_Node_Replica_Set"
          - name: Test MongoDB 9, three-node replica sets
            tests: "MongoIntegrationTest$Mongo_9_*__Three_Node_Replica_Set"
          - name: Test MongoDB 9, other topologies
            tests: "MongoIntegrationTest$Mongo_9_*,!MongoIntegrationTest$Mongo_9_*__Three_Node_Replica_Set"
          - name: Test Redis 6, latest
            tests: "RedisIntegrationTest$Redis_6_2_latest"
          - name: Test Redis 6, other topologies
            tests: "RedisIntegrationTest$Redis_6_*,!RedisIntegrationTest$Redis_6_2_latest"
          - name: Test Redis 7, latest
            tests: "RedisIntegrationTest$Redis_7_latest"
          - name: Test Redis 7, other topologies
            tests: "RedisIntegrationTest$Redis_7_*,!RedisIntegrationTest$Redis_7_latest"
          - name: Test Redis 8, latest
            tests: "RedisIntegrationTest$Redis_8_latest"
          - name: Test Redis 8, other topologies
            tests: "RedisIntegrationTest$Redis_8_*,!RedisIntegrationTest$Redis_8_latest"
          - name: Test Valkey 7, latest
            tests: "RedisIntegrationTest$Valkey_7_2_latest"
          - name: Test Valkey 7, other topologies
            tests: "RedisIntegrationTest$Valkey_7_*,!RedisIntegrationTest$Valkey_7_2_latest"
          - name: Test Valkey 8, latest
            tests: "RedisIntegrationTest$Valkey_8_latest"
          - name: Test Valkey 8, other topologies
            tests: "RedisIntegrationTest$Valkey_8_*,!RedisIntegrationTest$Valkey_8_latest"
          - name: Test Valkey 9, latest
            tests: "RedisIntegrationTest$Valkey_9_latest"
          - name: Test Valkey 9, other topologies
            tests: "RedisIntegrationTest$Valkey_9_*,!RedisIntegrationTest$Valkey_9_latest"
          - name: Test Dragonfly 1, latest
            tests: "RedisIntegrationTest$Dragonfly_1_latest"
          - name: Test Dragonfly 1, other topologies
            tests: "RedisIntegrationTest$Dragonfly_1_*,!RedisIntegrationTest$Dragonfly_1_latest"
          - name: Test Dragonfly 2, latest
            tests: "RedisIntegrationTest$Dragonfly_2_latest"
          - name: Test Dragonfly 2, other topologies
            tests: "RedisIntegrationTest$Dragonfly_2_*,!RedisIntegrationTest$Dragonfly_2_latest"
          - name: Test Kvrocks 2
            tests: "RedisIntegrationTest$Kvrocks_2_*"
          - name: Test MySQL 5, latest
            tests: "JdbcIntegrationTest$MySQL_5_7_latest"
          - name: Test MySQL 5, other topologies
            tests: "JdbcIntegrationTest$MySQL_5_*,!JdbcIntegrationTest$MySQL_5_7_latest"
          - name: Test MySQL 8, latest
            tests: "JdbcIntegrationTest$MySQL_8_latest"
          - name: Test MySQL 8, other topologies
            tests: "JdbcIntegrationTest$MySQL_8_*,!JdbcIntegrationTest$MySQL_8_latest"
          - name: Test MySQL 9, latest
            tests: "JdbcIntegrationTest$MySQL_9_latest"
          - name: Test MySQL 9, other topologies
            tests: "JdbcIntegrationTest$MySQL_9_*,!JdbcIntegrationTest$MySQL_9_latest"
          - name: Test MySQL 26, latest
            tests: "JdbcIntegrationTest$MySQL_26_latest"
          - name: Test MySQL 26, other topologies
            tests: "JdbcIntegrationTest$MySQL_26_*,!JdbcIntegrationTest$MySQL_26_latest"
          # the store majors under about 15 min in one job each
          - name: Test PostgreSQL 9
            tests: "PostgresIntegrationTest$Postgres_9_*"
          - name: Test PostgreSQL 10
            tests: "PostgresIntegrationTest$Postgres_10_*"
          - name: Test PostgreSQL 11
            tests: "PostgresIntegrationTest$Postgres_11_*"
          - name: Test PostgreSQL 12
            tests: "PostgresIntegrationTest$Postgres_12_*"
          - name: Test PostgreSQL 13
            tests: "PostgresIntegrationTest$Postgres_13_*"
          - name: Test PostgreSQL 14
            tests: "PostgresIntegrationTest$Postgres_14_*"
          - name: Test PostgreSQL 15
            tests: "PostgresIntegrationTest$Postgres_15_*"
          - name: Test PostgreSQL 16
            tests: "PostgresIntegrationTest$Postgres_16_*"
          - name: Test PostgreSQL 17
            tests: "PostgresIntegrationTest$Postgres_17_*"
          - name: Test PostgreSQL 18
            tests: "PostgresIntegrationTest$Postgres_18_*"
          - name: Test MariaDB 10
            tests: "JdbcIntegrationTest$MariaDB_10_*"
          - name: Test MariaDB 11
            tests: "JdbcIntegrationTest$MariaDB_11_*"
          - name: Test MariaDB 12
            tests: "JdbcIntegrationTest$MariaDB_12_*"
          - name: Test MariaDB 13
            tests: "JdbcIntegrationTest$MariaDB_13_*"
    steps:
      - name: Checkout the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit resolved above, not the run's own: a scheduled run starts from the default branch (main), a
          # run by hand from the branch the dialog shows
          ref: ${{ needs.changes.outputs.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run the group
        # no failIfNoSpecifiedTests=false: a group whose pattern matches no test (a typo, or a branch without these
        # tests) fails instead of passing with nothing tested. Single quotes: in double quotes bash expands the nested
        # class names ($Mongo_4_*) as variables and every group runs the whole test class
        run: mvn -B -DskipErrorProne test '-Dtest=${{ matrix.tests }}' ${{ matrix.flags }}
      - name: Report failed tests
        if: failure()
        uses: ./.github/workflows/common/report-failed-tests
        with:
          artifact-name: failed-tests-${{ strategy.job-index }}

  # a cache entry per commit that passed every group, which the release (continuous-delivery.yml) requires of the
  # commit it releases: the run itself carries the commit of the branch it started from, not the one tested, and a run
  # skipped by the marker above passes without testing anything. The release finds it through the API, whichever
  # branch's scope it was saved in
  passed:
    name: Mark the commit as passed
    needs: [ changes, group ]
    if: needs.group.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the marker
        run: echo "${{ needs.changes.outputs.sha }}" > nightly-passed
      - name: Save the marker
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nightly-passed
          key: nightly-passed-${{ needs.changes.outputs.sha }}
