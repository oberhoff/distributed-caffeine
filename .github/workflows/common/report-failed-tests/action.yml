name: Report failed tests
description: >-
  The failures each test JVM recorded (testing.FailureLog), as Surefire's reports keep only the last topology of a
  class: an annotation each, readable through the API (a job's check run), the whole list in the job summary (GitHub
  shows at most 10 error annotations per step), and the files as an artifact. Used by the test workflows after a
  failed step (if: failure()).

inputs:
  artifact-name:
    description: The name of the artifact keeping the failure files, unique per job of a run
    required: true

runs:
  using: composite
  steps:
    - name: Report failed tests
      shell: bash
      run: |
        shopt -s nullglob
        files=(target/test-failures/*.txt)
        [ ${#files[@]} -gt 0 ] || exit 0
        {
          echo "### Failed tests"
          echo
          sort -u "${files[@]}" | while IFS=$'\t' read -r test message; do echo "- **${test}**: ${message}"; done
        } >> "$GITHUB_STEP_SUMMARY"
        sort -u "${files[@]}" | while IFS=$'\t' read -r test message; do
          title=${test//%/%25}; title=${title//,/%2C}; title=${title//:/%3A}
          echo "::error title=${title}::${message//%/%25}"
        done
    - name: Keep the failed tests
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: target/test-failures/
        if-no-files-found: ignore
        retention-days: 14
