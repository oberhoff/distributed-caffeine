name: Retarget Pull Request to Develop

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: retarget-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retarget-pull-request-to-develop:
    name: Retarget Pull Request to Develop
    runs-on: ubuntu-latest
    steps:
      - name: Change base branch to develop
        uses: actions/github-script@v7
        with:
          script: |
            const previousBase = context.payload.pull_request.base.ref;
            const { data: pr } = await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              base: 'develop'
            });
            core.info(
              `Retargeted PR #${pr.number} from '${previousBase}' to '${pr.base.ref}'.`
            );
