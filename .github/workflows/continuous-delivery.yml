name: Continuous Delivery (CD)

on:
  release:
    types: [ created ]

# read only: the deploy goes to Maven Central with its own credentials
permissions:
  contents: read

jobs:
  continuous-delivery:
    name: Continuous Delivery (CD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          # the whole history, to check the released commit's place in it
          fetch-depth: 0
      # a release event has no branch filter (GitHub ignores one): only a commit on main, which reaches it through a
      # tested pull request, is deployed, whatever tag the release was created from
      - name: Require a commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release's commit $GITHUB_SHA is not on main: not deployed"
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME_TOKEN
          server-password: MAVEN_CENTRAL_PASSWORD_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy with Maven
        run: mvn clean deploy -DskipTests -DskipErrorProne
        env:
          MAVEN_CENTRAL_USERNAME_TOKEN: ${{ secrets.MAVEN_CENTRAL_USERNAME_TOKEN }}
          MAVEN_CENTRAL_PASSWORD_TOKEN: ${{ secrets.MAVEN_CENTRAL_PASSWORD_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
