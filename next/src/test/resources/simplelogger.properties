# warnings from everything (Testcontainers, drivers), and what the library logs at INFO
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.io.github.oberhoff.distributedcaffeine=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
# the parity tests throw from loaders on purpose, which Caffeine logs with a stack trace each
org.slf4j.simpleLogger.log.com.github.benmanes.caffeine=off
